services:

  postgres-test:
    image: postgres:16
    container_name: saas-postgres-test
    environment:
      POSTGRES_DB: saas_estoque_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_estoque_test"]
      interval: 3s
      timeout: 5s
      retries: 10